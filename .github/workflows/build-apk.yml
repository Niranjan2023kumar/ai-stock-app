name: Build & Release APK

# Triggers:
# 1. Auto — every push to main builds a fresh APK
# 2. Manual — tap "Run workflow" on GitHub from your phone anytime
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (leave blank for auto timestamp)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    # Allow this job to create GitHub Releases and upload files to them
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # JDK 17 matches the project's compileOptions
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # GitHub's ubuntu-latest has Android SDK at $ANDROID_HOME.
      # We write local.properties so Gradle finds it (this file is .gitignored).
      # API keys come from GitHub Secrets — add them at:
      # https://github.com/Niranjan2023kumar/ai-stock-app/settings/secrets/actions
      # If a secret is not set it defaults to empty string (app handles gracefully).
      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME"                                    > local.properties
          echo "POLYGON_API_KEY=${{ secrets.POLYGON_API_KEY }}"          >> local.properties
          echo "FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}"          >> local.properties
          echo "ALPHAVANTAGE_API_KEY=${{ secrets.ALPHAVANTAGE_API_KEY }}" >> local.properties
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}"            >> local.properties
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}"      >> local.properties
          echo "NEWS_API_KEY=${{ secrets.NEWS_API_KEY }}"                >> local.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Strip Windows-only paths from gradle.properties — these point to
      # C:\Program Files\... and a local Avast truststore that don't exist on
      # ubuntu-latest and cause Gradle to refuse to start.
      - name: Override Windows-only gradle properties for CI
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties
          sed -i '/systemProp.javax.net.ssl.trustStore/d' gradle.properties
          sed -i '/systemProp.javax.net.ssl.trustStorePassword/d' gradle.properties
          echo "--- gradle.properties after stripping Windows paths ---"
          cat gradle.properties

      # Build only the debug variant — fast, no signing needed, installs fine
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # Locate the built APK (path varies by Gradle version)
      - name: Find APK path
        id: apk
        run: |
          APK=$(find . -name "*.apk" -path "*/debug/*" | grep -v "androidTest" | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "Built APK: $APK"
          ls -lh "$APK"

      # Generate a timestamped tag so every build gets its own release
      - name: Compute release tag
        id: tag
        run: |
          CUSTOM="${{ github.event.inputs.tag }}"
          if [ -n "$CUSTOM" ]; then
            echo "value=$CUSTOM" >> $GITHUB_OUTPUT
          else
            echo "value=auto-$(date -u +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT
          fi

      # Upload APK as a GitHub Release — downloadable straight from your phone
      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: "Build ${{ steps.tag.outputs.value }}"
          body: |
            ## Install on your phone

            1. Tap the `.apk` file below
            2. If asked, allow "Install from unknown sources" in your phone settings
            3. Install and open the app

            Built automatically from the latest code on `main`.
          files: ${{ steps.apk.outputs.path }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
